<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARALLELS — Every Choice Is a Door</title>
<style>
  :root{
    --bg:#05060f; --ink:#eef1ff; --muted:#9aa3c7;
    --violet:#8b5cf6; --cyan:#22d3ee; --gold:#fbbf24; --rose:#fb7185; --green:#34d399;
    --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  #stars{position:fixed;inset:0;z-index:0;display:block}
  #glow{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(139,92,246,.18), transparent 60%),
      radial-gradient(50% 40% at 80% 100%, rgba(34,211,238,.12), transparent 60%),
      radial-gradient(45% 40% at 10% 90%, rgba(251,113,133,.10), transparent 60%);
  }
  .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    max-width:920px;margin:0 auto;padding:24px 22px 14px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:800;letter-spacing:.32em;font-size:14px;
    background:linear-gradient(90deg,var(--cyan),var(--violet),var(--rose));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .chapter{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;text-align:right}
  .stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0;overflow-y:auto}
  .fade{animation:fade .6s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .title-h1{font-size:clamp(46px,10vw,96px);font-weight:900;letter-spacing:.04em;line-height:.95;
    background:linear-gradient(120deg,#fff,#c4b5fd 40%,var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(139,92,246,.25);}
  .tagline{margin-top:18px;font-size:clamp(16px,2.4vw,21px);color:#d7dcff;max-width:560px}
  .subline{margin-top:14px;font-size:15px;color:var(--muted);max-width:560px;line-height:1.6}

  .scene-kicker{color:var(--cyan);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:14px}
  .scene-title{font-size:clamp(23px,4.2vw,38px);font-weight:800;line-height:1.14;max-width:720px}
  .scene-body{margin-top:16px;font-size:clamp(15px,2vw,18px);color:#cdd4f5;max-width:660px;line-height:1.65}

  .doors{margin-top:26px;display:grid;gap:13px}
  .door{text-align:left;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    border:1px solid var(--line);border-radius:16px;padding:17px 20px;color:var(--ink);font:inherit;
    display:flex;align-items:center;gap:16px;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease;}
  .door:hover{transform:translateY(-2px);border-color:rgba(139,92,246,.55);
    background:linear-gradient(180deg,rgba(139,92,246,.14),rgba(34,211,238,.05));
    box-shadow:0 12px 40px -18px rgba(139,92,246,.9);}
  .door.fatal:hover{border-color:rgba(251,113,133,.55);
    background:linear-gradient(180deg,rgba(251,113,133,.14),rgba(139,92,246,.04));
    box-shadow:0 12px 40px -18px rgba(251,113,133,.9);}
  .door .icon{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;font-size:22px;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.25), rgba(139,92,246,.25));
    border:1px solid rgba(255,255,255,.12);}
  .door .txt b{display:block;font-size:16px;margin-bottom:3px}
  .door .txt span{font-size:13px;color:var(--muted)}

  .btn{cursor:pointer;font:inherit;font-weight:700;border:none;border-radius:999px;padding:15px 34px;font-size:16px;
    color:#0a0a17;background:linear-gradient(90deg,var(--cyan),var(--violet));
    box-shadow:0 14px 40px -14px rgba(139,92,246,.9);transition:transform .16s ease,filter .16s ease;}
  .btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
  .btn-row{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

  .path-wrap{padding-top:8px}
  .path-label{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
  #pathSvg{width:100%;height:52px;display:block}

  /* checkpoint */
  .cp-tag{color:var(--gold);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:14px}
  .cp-title{font-size:clamp(24px,4.4vw,40px);font-weight:800;line-height:1.12;max-width:720px}
  .cp-body{margin-top:16px;font-size:clamp(15px,2vw,18px);color:#cdd4f5;max-width:660px;line-height:1.65}
  .cp-blurb{margin-top:16px;font-size:15px;color:#c4b5fd;max-width:640px;line-height:1.7;font-style:italic}

  /* story ending */
  .end-tag{color:var(--rose);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:14px}
  .end-title{font-size:clamp(26px,5vw,44px);font-weight:900;line-height:1.08;max-width:720px;
    background:linear-gradient(120deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .end-body{margin-top:18px;font-size:clamp(15px,2.1vw,19px);color:#d7dcff;max-width:660px;line-height:1.7}
  .soft-note{margin-top:20px;font-size:14px;color:var(--muted);max-width:600px;line-height:1.6;font-style:italic}

  /* universe capstone */
  .verse-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .verse-id{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;letter-spacing:.12em;color:var(--cyan);
    border:1px solid rgba(34,211,238,.35);border-radius:999px;padding:6px 14px;background:rgba(34,211,238,.06);}
  .rarity{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.18em;border:1px solid;border-radius:999px;padding:6px 12px;}
  .verse-name{font-size:clamp(28px,5.2vw,48px);font-weight:900;line-height:1.05;
    background:linear-gradient(120deg,#fff,var(--gold) 60%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .verse-desc{margin-top:16px;font-size:clamp(15px,2vw,18px);color:#d7dcff;max-width:640px;line-height:1.7}
  .bars{margin-top:20px;display:grid;gap:11px;max-width:520px}
  .bar-row{display:flex;align-items:center;gap:12px}
  .bar-row .lab{width:96px;font-size:13px;color:var(--muted);text-align:right}
  .bar-track{flex:1;height:9px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
  .bar-fill{display:block;height:100%;border-radius:999px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .roads{margin-top:20px;font-size:14px;color:var(--muted);max-width:600px;line-height:1.7;
    border-left:2px solid rgba(139,92,246,.5);padding-left:16px;font-style:italic}
  .hope{margin-top:16px;font-size:15px;color:#c4b5fd;max-width:600px;line-height:1.7}
  .challenge-cta{margin-top:22px;font-size:15px;color:#d7dcff;max-width:560px;line-height:1.6}
  .challenge-cta b{color:var(--gold)}
  .challenge-banner{margin-top:20px;font-size:16px;color:#eef1ff;max-width:560px;line-height:1.6;
    background:linear-gradient(180deg,rgba(139,92,246,.16),rgba(34,211,238,.06));
    border:1px solid rgba(139,92,246,.4);border-radius:14px;padding:16px 18px;}
  .challenge-banner b{color:var(--cyan)}

  .collapse-txt{font-size:clamp(22px,4vw,36px);font-weight:800;line-height:1.25;color:#eef1ff}
  .collapse-sub{margin-top:14px;color:var(--cyan);font-size:13px;letter-spacing:.24em;text-transform:uppercase}
  .foot{margin-top:auto;padding-top:12px;font-size:11px;color:#5b628a;text-align:center;letter-spacing:.04em}

  /* ---- Change One Thing (reality-shift) mode ---- */
  #toneglow{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .8s ease;mix-blend-mode:screen}
  .mode-hint{margin-top:18px;font-size:14px;color:var(--muted);max-width:600px;line-height:1.6}
  .mode-hint b{color:#d7dcff}
  .base-life{margin-top:16px;font-size:clamp(16px,2.1vw,19px);color:#cdd4f5;max-width:680px;line-height:1.7}
  .shift-prompt{color:var(--cyan);font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin:26px 0 12px}
  .tone-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.16em;border:1px solid;border-radius:999px;padding:6px 12px;margin-bottom:16px}
  .shift-new{font-size:clamp(16px,2.1vw,20px);color:#eef1ff;max-width:700px;line-height:1.7}
  .shift-new.dim{color:#8b93c9;font-size:clamp(14px,1.8vw,16px)}
  .ripple-label{margin-top:22px;color:var(--rose);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:8px}
  .ripple-txt{font-size:clamp(15px,2vw,18px);color:#d7dcff;max-width:700px;line-height:1.7}
  .shift-line{margin-top:18px;font-size:15px;color:#c4b5fd;max-width:640px;line-height:1.7;font-style:italic;
    border-left:2px solid rgba(139,92,246,.5);padding-left:16px}
  @keyframes realityShift{
    0%{opacity:0;transform:translateX(-8px) skewX(7deg);filter:blur(7px)}
    30%{opacity:.5;transform:translateX(6px) skewX(-4deg);filter:blur(3px)}
    60%{opacity:.85;transform:translateX(-2px) skewX(1deg);filter:blur(1px)}
    100%{opacity:1;transform:none;filter:none}
  }
  .reality .tone-tag,.reality .shift-new,.reality .scene-kicker{animation:realityShift .75s cubic-bezier(.2,.7,.2,1) both}
  .reality .shift-new{animation-delay:.1s}

  /* ---- Your Own Life (personalization) ---- */
  .form-grid{margin-top:22px;display:grid;gap:14px;max-width:560px}
  .ff{display:flex;flex-direction:column;gap:6px}
  .ff label{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .ff input,.ff select{font:inherit;color:var(--ink);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;width:100%}
  .ff input:focus,.ff select:focus{border-color:rgba(139,92,246,.6);background:rgba(139,92,246,.08)}
  .ff select option{background:#12121f;color:var(--ink)}
  .form-err{color:var(--rose);font-size:14px;margin-top:12px;display:none}
  .moment-year{color:var(--cyan);font-weight:800}
  .privacy{margin-top:14px;font-size:12px;color:#5b628a;max-width:560px}
  .life-out{font-size:clamp(16px,2.1vw,20px);color:#eef1ff;max-width:700px;line-height:1.7}
  .life-out.dim{color:#8b93c9;font-size:clamp(14px,1.8vw,16px)}
  .era-card{margin-top:18px;max-width:680px;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,rgba(34,211,238,.07),rgba(255,255,255,.02));padding:14px 16px}
  .era-card .eh{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px}
  .era-row{display:flex;gap:12px;font-size:14px;color:#cdd4f5;line-height:1.55;margin-top:8px}
  .era-row .k{flex:0 0 84px;color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.08em;padding-top:3px}
  .era-row .v{flex:1}
  .ai-note{margin-top:16px;font-size:12px;color:#5b628a;max-width:600px;line-height:1.5}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="glow"></div>
<div id="toneglow"></div>
<div class="wrap">
  <div class="topbar">
    <div class="brand">P A R A L L E L S</div>
    <div class="chapter" id="chapter"></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="path-wrap">
    <div class="path-label" id="pathLabel"></div>
    <svg id="pathSvg" viewBox="0 0 600 52" preserveAspectRatio="none"></svg>
  </div>
  <div class="foot">A single choice becomes a universe. This one is yours.</div>
</div>

<script>
/* =========================================================================
   PARALLELS v4 — a branching multiverse story engine.
   The story is a GRAPH of nodes. Each choice points to the next node,
   paths reconverge, some endings can continue. Traits accumulate across
   every act and, at the end, collapse into the universe you built.
   Node types:
     decision  : has choices[] (each: icon,head,sub,eff,next[,fatal])
     checkpoint: act break — title/body + auto "Continue" to .next
     ending    : terminal narrative — title/body [+ continues: nodeId]
   ========================================================================= */

const DIMS = {
  bold:{label:"Boldness",color:"#fb7185"},
  bond:{label:"Connection",color:"#22d3ee"},
  grit:{label:"Grit",color:"#34d399"},
  vision:{label:"Vision",color:"#8b5cf6"},
};

const STORY = {
  start:"i_open",
  nodes:{

  /* ================= ACT I — THE THRESHOLD ================= */
  i_open:{ act:"Act I · The Threshold", kicker:"The Threshold",
    title:"It's late, and the day beat you.",
    body:"You're at the bottom of something — you can feel it. Then your phone lights up: a message, a chance, a hand reaching into the dark. You were one breath from shutting it all down for the night, maybe for good.",
    choices:[
      {icon:"💬",head:"Reach back into the dark.",sub:"Answer. Let someone in, just this once.",eff:{bond:2,bold:1},next:"i_reach"},
      {icon:"🚪",head:"Shut the door. Stay safe.",sub:"You've been let down before. Not again.",eff:{grit:2,bond:-1},next:"i_guard"},
      {icon:"⚡",head:"Ignore it — chase your own spark.",sub:"There's an idea in you that won't let go.",eff:{vision:2,bold:1},next:"i_spark"},
    ]},
  i_reach:{ act:"Act I · The Threshold", kicker:"The Meeting",
    title:"You reached back. Now they want to meet.",
    body:"It's real. There's a person on the other end of this, and a door you didn't expect. But doors swing both ways — they'll see you, all of you.",
    choices:[
      {icon:"🫀",head:"Show up as your real self.",sub:"Scars, mess, and all. Take the risk of being known.",eff:{bond:2,grit:1},next:"i_reach2"},
      {icon:"🎭",head:"Show up as who you wish you were.",sub:"Impress first. Let them meet the real you later.",eff:{bold:2,vision:1},next:"i_reach2"},
    ]},
  i_reach2:{ act:"Act I · The Threshold", kicker:"The Hard Part",
    title:"It's going well. Then they glimpse the hard part of your life.",
    body:"Every life has a room it doesn't show on the first visit. They just found the door to yours. What you do now decides whether this becomes something — or stays a stranger you almost loved.",
    choices:[
      {icon:"🔑",head:"Let them into the messy room.",sub:"No more hiding. If it's real, it survives the truth.",eff:{bond:2},next:"i_check"},
      {icon:"🛡️",head:"Pull away to protect them.",sub:"They deserve better than your storm.",eff:{grit:1,bond:-1},next:"i_check"},
    ]},
  i_guard:{ act:"Act I · The Threshold", kicker:"The Silence",
    title:"You shut the door. The silence is safe — and heavy.",
    body:"No one can hurt you in here. But no one can reach you either. The quiet you built for protection starts to feel like a cell.",
    choices:[
      {icon:"🔨",head:"Pour everything into a goal.",sub:"If people won't stay, build something that will.",eff:{grit:2,vision:1},next:"i_guard2"},
      {icon:"📱",head:"The loneliness cracks you. Reach out after all.",sub:"Maybe safe isn't the same as alive.",eff:{bond:2},next:"i_reach2"},
    ]},
  i_guard2:{ act:"Act I · The Threshold", kicker:"The Work",
    title:"You built something alone. It's yours. But who's it for?",
    body:"You made real progress in the quiet. There's pride in that. There's also an empty chair at the table you set for one.",
    choices:[
      {icon:"⛰️",head:"Keep climbing solo.",sub:"The summit is close. Don't slow down now.",eff:{grit:2,bold:1},next:"i_check"},
      {icon:"🚪",head:"Open the door to one person.",sub:"Let a single someone see what you've made.",eff:{bond:2},next:"i_check"},
    ]},
  i_spark:{ act:"Act I · The Threshold", kicker:"The Spark",
    title:"You chased the idea. Everyone said it was crazy.",
    body:"It kept you up at night — the thing only you can see. The people around you called it a distraction, a fantasy, a waste. But it's yours, and it's alive.",
    choices:[
      {icon:"🔥",head:"Go all in. Burn the boats.",sub:"No backup plan. Backup plans are for doubters.",eff:{bold:3},next:"i_spark2"},
      {icon:"🌱",head:"Build it quietly on the side.",sub:"Grow it in the dark until it's ready for light.",eff:{grit:2,vision:1},next:"i_spark2"},
    ]},
  i_spark2:{ act:"Act I · The Threshold", kicker:"The Weight",
    title:"The idea is alive, but fragile. It needs more than you have.",
    body:"You've taken it as far as one pair of hands can. Now it's asking for something — more people, more time, more of you than you're sure you can give.",
    choices:[
      {icon:"🤝",head:"Bring people in to help it grow.",sub:"Share the dream. Let it outgrow you.",eff:{bond:2,vision:1},next:"i_check"},
      {icon:"🔒",head:"Protect it. Do it all yourself.",sub:"No one will love it like you do.",eff:{grit:2},next:"i_check"},
      {icon:"💤",head:"The pressure wins. Walk away from all of it.",sub:"Maybe it was never meant to be.",eff:{bond:-1,grit:-1},next:"end_walkaway",fatal:true},
    ]},
  i_check:{ checkpoint:true, tag:"End of Act I", next:"ii_open",
    title:"The hardest part — starting — is behind you.",
    body:"You found the first door in the dark and you walked through it. Whatever it cost, you're no longer standing still. The climb is next." },

  /* ================= ACT II — THE CLIMB ================= */
  ii_open:{ act:"Act II · The Climb", kicker:"The Climb",
    title:"Now you have to build something that lasts.",
    body:"The beginning is behind you; the grind is here. There's a way up, but every route asks for a different piece of you.",
    choices:[
      {icon:"🚀",head:"Take a big swing to grow fast.",sub:"Bet bigger than is comfortable.",eff:{bold:2,vision:1},next:"ii_risk"},
      {icon:"🧱",head:"Grind — steady, reliable, brick by brick.",sub:"Slow is smooth, smooth is lasting.",eff:{grit:2},next:"ii_grind"},
      {icon:"🪜",head:"Lift others as you climb.",sub:"Build the ladder wide enough for more than you.",eff:{bond:2},next:"ii_lift"},
    ]},
  ii_risk:{ act:"Act II · The Climb", kicker:"The Bet",
    title:"You swung big. For a while, it soared.",
    body:"Momentum, attention, the taste of something working. And then the ground shifts — the thing you bet on wobbles under the weight of its own speed.",
    choices:[
      {icon:"💪",head:"Double down. Push through the wobble.",sub:"Nerve got you here. Nerve gets you out.",eff:{bold:2,grit:1},next:"ii_setback"},
      {icon:"🧭",head:"Pivot to something truer.",sub:"The wobble is information. Listen to it.",eff:{vision:2},next:"ii_setback"},
    ]},
  ii_grind:{ act:"Act II · The Climb", kicker:"The Grind",
    title:"Brick by brick, it's becoming real.",
    body:"No fireworks — just the quiet accumulation of days done right. But the load is getting heavy, and you're carrying it alone.",
    choices:[
      {icon:"🎯",head:"Keep your head down. Carry it alone.",sub:"You trust your own hands most.",eff:{grit:2},next:"ii_setback"},
      {icon:"🤲",head:"Let someone in to share the load.",sub:"A weight split two ways travels farther.",eff:{bond:2},next:"ii_setback"},
    ]},
  ii_lift:{ act:"Act II · The Climb", kicker:"The Others",
    title:"You started bringing people up with you.",
    body:"It's slower this way. Messier. But the climb has voices now, and the summit stopped feeling so lonely. Then someone you're carrying starts to slip.",
    choices:[
      {icon:"❤️",head:"Sacrifice your own climb to catch them.",sub:"No one gets left on the mountain.",eff:{bond:3,grit:1},next:"ii_setback"},
      {icon:"🌉",head:"Find a way to rise together.",sub:"Refuse the choice between them and the summit.",eff:{bond:1,vision:2},next:"ii_setback"},
    ]},
  ii_setback:{ act:"Act II · The Climb", kicker:"The Fall",
    title:"Then life knocks you flat.",
    body:"An injury. A betrayal. A door you were counting on, slammed and locked. The plan is gone, and for one long moment it feels like the whole future went with it. The next breath decides everything.",
    choices:[
      {icon:"🌅",head:"Rebuild — slower, but a new way.",sub:"The comeback writes a better story than the plan did.",eff:{grit:2,vision:1},next:"ii_check"},
      {icon:"🔥",head:"Push harder down the same road.",sub:"Refuse to let it take what you wanted.",eff:{bold:2,grit:1},next:"ii_check"},
      {icon:"🕳️",head:"Let it end you. Stop here.",sub:"You're so tired. Maybe this is where it stops.",eff:{bond:-1,grit:-1},next:"end_broken",fatal:true},
    ]},
  ii_check:{ checkpoint:true, tag:"End of Act II", next:"iii_open",
    title:"You climbed, you fell, and you got back up.",
    body:"The shape of your life is emerging now — not the one you planned, but a realer one, forged in the falling and the standing back up. What you do with it is the last question." },

  /* ================= ACT III — THE LEGACY ================= */
  iii_open:{ act:"Act III · The Legacy", kicker:"The Legacy",
    title:"You made it somewhere the old you couldn't have imagined.",
    body:"There's weight in what you've lived through, and now, finally, a choice that isn't about survival. It's about what all of it was FOR.",
    choices:[
      {icon:"📣",head:"Tell your story to help others.",sub:"Someone out there needs to hear it can be done.",eff:{vision:2,bond:1},next:"iii_tell"},
      {icon:"🛠️",head:"Build quietly. Let the work speak.",sub:"The proof is what you made, not what you said.",eff:{grit:2},next:"iii_build"},
      {icon:"👑",head:"Give it all to family first.",sub:"The legacy begins at your own kitchen table.",eff:{bond:2,grit:1},next:"iii_family"},
    ]},
  iii_tell:{ act:"Act III · The Legacy", kicker:"The Voice",
    title:"You decided your story belongs to more than just you.",
    body:"But how loud, and to whom? A story can be a stadium roar or a whisper that changes one life completely.",
    choices:[

/* ---------- State + rendering ---------- */
let nodeId = STORY.start;
let totals = {bold:0,bond:0,grit:0,vision:0};
let journey = [];          // {chosen, count} per decision
let currentResult = null;

const stage = document.getElementById('stage');
const chapterEl = document.getElementById('chapter');
const pathSvg = document.getElementById('pathSvg');
const pathLabel = document.getElementById('pathLabel');

function resetRun(){
  nodeId = STORY.start;
  totals = {bold:0,bond:0,grit:0,vision:0};
  journey = [];
  currentResult = null;
}
function domOf(t){ return Object.keys(t).sort((a,b)=>t[b]-t[a]); }

/* ================= Title ================= */
function renderTitle(){
  chapterEl.textContent=""; pathLabel.textContent=""; pathSvg.innerHTML="";
  stage.className="stage fade";
  const banner = incomingChallenge ? `
    <div class="challenge-banner">🌌 You've been challenged. Someone out there built <b>${incomingChallenge.name}</b>.<br>Now the door is yours — which universe will <b>you</b> build?</div>` : '';
  stage.innerHTML = `
    <h1 class="title-h1">PARALLELS</h1>
    <p class="tagline">Every choice is a door. Every door is a universe.</p>
    ${banner}
    <div class="btn-row">
      <button class="btn" id="startBtn">${incomingChallenge?'Build my universe':'Live the Story'}</button>
      <button class="btn ghost" id="shiftBtn">Change One Thing ✦</button>
      <button class="btn ghost" id="lifeBtn">Your Own Life ✦ ᴮᴱᵀᴬ</button>
    </div>
    <p class="mode-hint"><b>Live the Story</b> — a branching life in four acts. <b>Change One Thing</b> — step sideways into another life and watch reality rewrite itself; pick a pack (horror, comedy, love, founder, family). <b>Your Own Life</b> — enter your real details, go back to a real turning point in your past, and see the universe a different choice would've opened. Not every timeline is a happy one.</p>
  `;
  toneGlow(null);
  document.getElementById('startBtn').onclick = ()=>{ toneGlow(null); resetRun(); go(STORY.start); };
  document.getElementById('shiftBtn').onclick = startShiftMode;
  document.getElementById('lifeBtn').onclick = renderProfileIntake;
}

/* ================= Router ================= */
function go(id){
  nodeId = id;
  const node = STORY.nodes[id];
  if(!node){ console.error("Missing node:", id); return; }
  if(node.ending) return renderStoryEnding(node);
  if(node.checkpoint) return renderCheckpoint(node);
  return renderDecision(node);
}

function renderDecision(node){
  chapterEl.textContent = node.act || "";
  stage.className="stage fade";
  const doors = node.choices.map((c,i)=>`
    <button class="door${c.fatal?' fatal':''}" data-i="${i}">
      <span class="icon">${c.icon}</span>
      <span class="txt"><b>${c.head}</b><span>${c.sub}</span></span>
    </button>`).join("");
  stage.innerHTML = `
    <div class="scene-kicker">${node.kicker||""}</div>
    <div class="scene-title">${node.title}</div>
    <div class="scene-body">${node.body}</div>
    <div class="doors">${doors}</div>`;
  stage.querySelectorAll('.door').forEach(b=> b.onclick = ()=>choose(node, parseInt(b.dataset.i,10)));
  drawPath();
}

function choose(node, i){
  const c = node.choices[i];
  for(const k in c.eff) totals[k]+=c.eff[k];
  journey.push({chosen:i, count:node.choices.length});
  drawPath();
  go(c.next);
}

/* ================= Checkpoint (act break) ================= */
function renderCheckpoint(node){
  chapterEl.textContent = "";
  stage.className="stage fade";
  const dom = domOf(totals)[0];
  stage.innerHTML = `
    <div class="cp-tag">${node.tag}</div>
    <div class="cp-title">${node.title}</div>
    <div class="cp-body">${node.body}</div>
    <div class="cp-blurb">${CP_BLURB[dom]}</div>
    <div class="btn-row"><button class="btn" id="contBtn">Continue the story →</button></div>`;
  document.getElementById('contBtn').onclick = ()=>go(node.next);
  drawPath();
}

/* ================= Story ending (narrative) ================= */
function renderStoryEnding(node){
  chapterEl.textContent = "";
  stage.className="stage fade";
  const soft = node.continues;
  const buttons = soft ? `
      <button class="btn" id="contBtn">Continue the story →</button>
      <button class="btn ghost" id="revealBtn">End here — reveal my universe</button>`
    : `<button class="btn" id="revealBtn">Reveal my universe →</button>`;
  stage.innerHTML = `
    <div class="end-tag">${node.tag}</div>
    <div class="end-title">${node.title}</div>
    <div class="end-body">${node.body}</div>
    ${node.softNote?`<div class="soft-note">${node.softNote}</div>`:''}
    <div class="btn-row">${buttons}</div>`;
  if(soft) document.getElementById('contBtn').onclick = ()=>go(node.continues);
  document.getElementById('revealBtn').onclick = renderCollapse;
  drawPath();
}

/* ================= Reveal beat ================= */
function renderCollapse(){
  chapterEl.textContent="";
  stage.className="stage fade";
  stage.innerHTML = `
    <div style="text-align:center;width:100%">
      <div class="collapse-txt">Every choice you made<br>is collapsing into one universe…</div>
      <div class="collapse-sub">Reading your path through the multiverse</div>
    </div>`;
  drawPath();
  setTimeout(renderUniverse, 1600);
}

/* ================= Universe capstone ================= */
function rarityOf(t){
  const vals=Object.values(t);
  const spread=Math.max(...vals)-Math.min(...vals);
  const allPos=vals.every(v=>v>0);
  if(allPos && spread<=2) return {tier:"LEGENDARY",color:"#fbbf24"};
  if(spread<=4)          return {tier:"RARE",     color:"#c4b5fd"};
  if(spread<=8)          return {tier:"UNCOMMON", color:"#67e8f9"};
  return {tier:"COMMON", color:"#9aa3c7"};
}
function makeResult(t, jrny){
  const order=domOf(t), domKey=order[0], secondKey=order[1];
  const sig=jrny.reduce((a,j,k)=>a + j.chosen*(k+3), 0);
  const rarity=rarityOf(t);
  let name, desc;
  if(rarity.tier==="LEGENDARY"){
    name=BALANCED_NAME;
    desc="In this universe, you are the rare one who refused to become just one thing — bold and loving, unbreakable and dreaming, all at once. Almost no one holds all four. You do.";
  } else {
    name=PAIR_NAMES[`${domKey}-${secondKey}`]||"The Universe You Built";
    desc=`In this universe, you are the one who ${FRAG[domKey]} — the one who also ${FRAG2[secondKey]}.`;
  }
  const code=jrny.map(j=>j.chosen).join('');
  const num=100+(sig*37)%899;
  return {t:{...t}, domKey, secondKey, name, desc, trait:TRAIT[domKey],
    closer:CLOSERS[sig%CLOSERS.length], hope:HOPE[sig%HOPE.length],
    rarity, code, num, verseId:`UNIVERSE #${num}-${code}`};
}

function renderUniverse(){
  chapterEl.textContent="Your Universe";
  const R = makeResult(totals, journey);
  currentResult = R;
  const max=Math.max(6,...Object.values(R.t).map(x=>Math.abs(x)));
  const bars=Object.keys(DIMS).map(k=>{
    const pct=Math.max(4,Math.round((R.t[k]/max)*100));
    return `<div class="bar-row"><span class="lab">${DIMS[k].label}</span>
      <span class="bar-track"><span class="bar-fill" data-pct="${Math.min(100,pct)}" style="background:${DIMS[k].color}"></span></span></div>`;
  }).join("");
  stage.className="stage fade";
  stage.innerHTML = `
    <div class="verse-top">
      <span class="verse-id">${R.verseId}</span>
      <span class="rarity" style="color:${R.rarity.color};border-color:${R.rarity.color}55;background:${R.rarity.color}14">${R.rarity.tier}</span>
    </div>
    <div class="verse-name">${R.name}</div>
    <p class="verse-desc">${R.desc}</p>
    <div class="bars">${bars}</div>
    <p class="roads">${R.trait} ${R.closer}</p>
    <p class="hope">${R.hope}</p>
    <div class="challenge-cta">Now pass the door forward: which universe would <b>someone you love</b> build? Send it and find out.</div>
    <div class="btn-row">
      <button class="btn" id="shareBtn">Share my universe ✦</button>
      <button class="btn ghost" id="dlBtn">Download image</button>
      <button class="btn ghost" id="linkBtn">Copy challenge link</button>
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn ghost" id="againBtn">Live another life</button>
    </div>`;
  requestAnimationFrame(()=>stage.querySelectorAll('.bar-fill').forEach(f=>f.style.width=f.dataset.pct+"%"));
  document.getElementById('againBtn').onclick = ()=>renderTitle();
  document.getElementById('shareBtn').onclick = shareResult;
  document.getElementById('dlBtn').onclick = downloadCard;
  document.getElementById('linkBtn').onclick = copyLink;
  drawPath();
}

/* ================= Constellation path ================= */
function drawPath(){
  pathLabel.textContent = journey.length ? "Your path through the multiverse" : "";
  const W=600,H=52, n=Math.max(journey.length,1), gap=W/(n+1);
  let lines="",nodes="",prev=null;
  journey.forEach((step,i)=>{
    const x=gap*(i+1), count=step.count;
    for(let o=0;o<count;o++){
      const y=14 + o*((H-22)/(count-1||1));
      if(o===step.chosen){
        if(prev) lines+=`<line x1="${prev.x}" y1="${prev.y}" x2="${x}" y2="${y}" stroke="url(#g)" stroke-width="2" opacity=".9"/>`;
        nodes+=`<circle cx="${x}" cy="${y}" r="5.5" fill="#fff"/><circle cx="${x}" cy="${y}" r="9" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity=".8"/>`;
        prev={x,y};
      } else {
        nodes+=`<circle cx="${x}" cy="${y}" r="3" fill="#9aa3c7" opacity=".2"/>`;
      }
    }
  });
  pathSvg.innerHTML = `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs>${lines}${nodes}`;
}

/* ================= Sharing / viral loop ================= */
function shareLink(){ return location.origin + location.pathname + '?v=' + currentResult.code; }
function shareText(){ return `I built "${currentResult.name}" in PARALLELS 🌌 Every choice is a door. Which universe would YOU build?`; }
function buildCardBlob(){
  const c=document.createElement('canvas'); c.width=1080; c.height=1920;
  drawShareCard(c.getContext('2d'), currentResult);
  return new Promise(res=>c.toBlob(res,'image/png'));
}
async function shareResult(){
  const url=shareLink(), text=shareText();
  try{
    const blob=await buildCardBlob();
    const file=new File([blob],'my-universe.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],text,url}); return; }
    if(navigator.share){ await navigator.share({text,url}); return; }
  }catch(e){}
  downloadCard(); copyLink();
}
async function downloadCard(){
  const btn=document.getElementById('dlBtn');
  try{
    const blob=await buildCardBlob();
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='my-universe.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    if(btn){ btn.textContent="Saved ✓"; setTimeout(()=>btn.textContent="Download image",1800); }
  }catch(e){ if(btn) btn.textContent="Couldn't save"; }
}
function copyLink(){
  const btn=document.getElementById('linkBtn');
  navigator.clipboard?.writeText(shareLink()).then(()=>{
    if(btn){ btn.textContent="Link copied ✓"; setTimeout(()=>btn.textContent="Copy challenge link",1800); }
  }).catch(()=>{ if(btn) btn.textContent="Link ready"; });
}
function roundRect(ctx,x,y,w,h,r){ if(w<r*2)r=w/2; ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrapTextCentered(ctx,text,cx,y,maxW,lh){
  const words=text.split(' '); let line=''; const lines=[];
  for(const w of words){ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t; }
  if(line)lines.push(line); lines.forEach((ln,i)=>ctx.fillText(ln,cx,y+i*lh)); return lines.length;
}
function drawShareCard(x,R){
  const W=1080,H=1920;
  x.fillStyle="#05060f"; x.fillRect(0,0,W,H);
  let g=x.createRadialGradient(W*.5,H*.10,40,W*.5,H*.10,W*.85);
  g.addColorStop(0,"rgba(139,92,246,.38)"); g.addColorStop(1,"rgba(139,92,246,0)"); x.fillStyle=g; x.fillRect(0,0,W,H);
  g=x.createRadialGradient(W*.85,H*.92,40,W*.85,H*.92,W*.75);
  g.addColorStop(0,"rgba(34,211,238,.24)"); g.addColorStop(1,"rgba(34,211,238,0)"); x.fillStyle=g; x.fillRect(0,0,W,H);
  for(let i=0;i<170;i++){ x.globalAlpha=Math.random()*.7+.2; x.beginPath();
    x.arc(Math.random()*W,Math.random()*H,Math.random()*2.2+.5,0,7); x.fillStyle=Math.random()>.5?"#cbd5ff":"#8b93c9"; x.fill(); }
  x.globalAlpha=1; x.textAlign="center";
  x.fillStyle="#9aa3c7"; x.font="700 36px -apple-system,'Segoe UI',Roboto,sans-serif"; x.fillText("P A R A L L E L S",W/2,160);
  const rc=R.rarity.color; x.font="800 30px -apple-system,'Segoe UI',Roboto,sans-serif";
  const rw=x.measureText(R.rarity.tier).width+60;
  x.fillStyle=rc+"22"; roundRect(x,W/2-rw/2,400,rw,56,28); x.fill();
  x.strokeStyle=rc+"88"; x.lineWidth=2; roundRect(x,W/2-rw/2,400,rw,56,28); x.stroke();
  x.fillStyle=rc; x.fillText(R.rarity.tier,W/2,438);
  x.fillStyle="#9aa3c7"; x.font="400 42px -apple-system,'Segoe UI',Roboto,sans-serif"; x.fillText("The universe I built",W/2,540);
  const ng=x.createLinearGradient(90,560,990,760);
  ng.addColorStop(0,"#ffffff"); ng.addColorStop(.55,"#fbbf24"); ng.addColorStop(1,"#fb7185");
  x.fillStyle=ng; x.font="900 78px -apple-system,'Segoe UI',Roboto,sans-serif";
  const nLines=wrapTextCentered(x,R.name,W/2,660,920,90);
  let idY=660+nLines*90+40;
  x.fillStyle="#22d3ee"; x.font="500 34px ui-monospace,Menlo,monospace"; x.fillText(R.verseId,W/2,idY);
  const dims=Object.keys(DIMS), max=Math.max(6,...Object.values(R.t).map(v=>Math.abs(v))); let by=idY+120;
  dims.forEach(k=>{
    const pct=Math.max(.04,Math.min(1,R.t[k]/max));
    x.textAlign="right"; x.fillStyle="#9aa3c7"; x.font="500 32px -apple-system,sans-serif"; x.fillText(DIMS[k].label,380,by+9);
    x.fillStyle="rgba(255,255,255,.09)"; roundRect(x,410,by-20,500,28,14); x.fill();
    x.fillStyle=DIMS[k].color; roundRect(x,410,by-20,Math.max(28,500*pct),28,14); x.fill(); by+=76;
  });
  x.textAlign="center";
  const cg=x.createLinearGradient(0,0,W,0); cg.addColorStop(0,"#22d3ee"); cg.addColorStop(1,"#8b5cf6");
  x.fillStyle=cg; x.font="800 60px -apple-system,'Segoe UI',Roboto,sans-serif";
  x.fillText("Which universe",W/2,1640); x.fillText("would YOU build?",W/2,1712);
  x.fillStyle="#9aa3c7"; x.font="400 36px -apple-system,sans-serif"; x.fillText("Every choice is a door.",W/2,1800);
}

function renderProfileIntake(){
  toneGlow(null);
  chapterEl.textContent="Your Own Life"; pathLabel.textContent=""; pathSvg.innerHTML="";
  stage.className="stage fade";
  const p = profile || {};
  const eduOpts = ["","Still figuring it out","High school","Some college","Trade / vocational","Bachelor's","Graduate degree","Prefer not to say"];
  const famOpts = ["","Single","In a relationship","Married / partnered","I have kids","It's complicated","Prefer not to say"];
  const opt=(arr,sel)=>arr.map(o=>`<option ${o===sel?'selected':''} value="${esc(o)}">${o?esc(o):'Choose…'}</option>`).join('');
  stage.innerHTML=`
    <div class="scene-kicker">Beta · your real life</div>
    <div class="scene-title">Let's open a door back into your own life.</div>
    <div class="base-life">Tell me a little about you. Then you'll pick a real moment from your past, make a different choice, and see the universe it would've opened.</div>
    <div class="form-grid">
      <div class="ff"><label>Your name (optional)</label><input id="pf_name" value="${esc(p.name||'')}" placeholder="What should I call you?"></div>
      <div class="ff"><label>Your age today *</label><input id="pf_age" type="number" min="16" max="100" value="${p.age?esc(p.age):''}" placeholder="e.g. 30"></div>
      <div class="ff"><label>How far did school go?</label><select id="pf_edu">${opt(eduOpts,p.education||'')}</select></div>
      <div class="ff"><label>What do you do (or want to)?</label><input id="pf_job" value="${esc(p.job||'')}" placeholder="e.g. teacher, founder, still figuring it out"></div>
      <div class="ff"><label>Family / relationship</label><select id="pf_family">${opt(famOpts,p.family||'')}</select></div>
      <div class="ff"><label>One thing you love</label><input id="pf_love" value="${esc(p.love||'')}" placeholder="e.g. music, my kids, basketball"></div>
      <div class="ff"><label>One thing you'd change about your life</label><input id="pf_gripe" value="${esc(p.gripe||'')}" placeholder="e.g. I play it too safe"></div>
    </div>
    <div class="form-err" id="pf_err"></div>
    <div class="btn-row">
      <button class="btn" id="pf_go">Find my turning points →</button>
      <button class="btn ghost" id="pf_back">← Back</button>
    </div>
    <div class="privacy">Private by design: nothing you type here is saved or sent anywhere. It lives only in this browser tab, and vanishes when you close it.</div>`;
  document.getElementById('pf_go').onclick=()=>{
    const age=parseInt(document.getElementById('pf_age').value,10);
    const err=document.getElementById('pf_err');
    if(!age || age<16 || age>100){ err.textContent="Enter an age between 16 and 100 so I can find your turning points."; err.style.display="block"; return; }
    profile={
      name:document.getElementById('pf_name').value.trim(),
      age, birthYear:CURRENT_YEAR-age,
      education:document.getElementById('pf_edu').value,
      job:document.getElementById('pf_job').value.trim(),
      family:document.getElementById('pf_family').value,
      love:document.getElementById('pf_love').value.trim(),
      gripe:document.getElementById('pf_gripe').value.trim(),
    };
    renderMomentPicker();
  };
  document.getElementById('pf_back').onclick=renderTitle;
}

function renderMomentPicker(){
  toneGlow(null);
  chapterEl.textContent="Your Own Life";
  stage.className="stage fade";
  const avail=STAGES.filter(s=> s.age <= profile.age);
  const hi = profile.name ? esc(profile.name)+", pick" : "Pick";
  const cards = avail.length ? avail.map((s,i)=>`
    <button class="door" data-i="${i}">
      <span class="icon">${s.emoji}</span>
      <span class="txt"><b>Age ${s.age} · <span class="moment-year">${profile.birthYear+s.age}</span></b><span>${s.label} · ${esc(eraDetail(profile.birthYear+s.age).vibe)}</span></span>
    </button>`).join('') : `<div class="base-life">You're at the very start of the story. Come back in a few years and there'll be turning points to revisit.</div>`;
  stage.innerHTML=`
    <div class="scene-kicker">You were born around ${profile.birthYear}</div>
    <div class="scene-title">${hi} a moment to go back to.</div>
    <div class="base-life">These are the real forks in your timeline. Step into one, make the other choice, and watch the universe it opens.</div>
    <div class="doors">${cards}</div>
    <div class="btn-row"><button class="btn ghost" id="editBtn">← Edit my info</button></div>`;
  stage.querySelectorAll('.door').forEach(b=> b.onclick=()=>renderLifeScene(avail[parseInt(b.dataset.i,10)]));
  document.getElementById('editBtn').onclick=renderProfileIntake;
}

  toneGlow(null);
  const year=profile.birthYear+s.age, era=eraContext(year), d=eraDetail(year);
  const sc=s.make(profile, year, era);
  chapterEl.textContent=`Age ${s.age} · ${year}`;
  stage.className="stage fade";
  const doors=sc.choices.map((c,i)=>`
    <button class="door" data-i="${i}">
      <span class="icon">${c.icon}</span>
      <span class="txt"><b>${c.head}</b><span>${c.sub}</span></span>
    </button>`).join('');
  stage.innerHTML=`
    <div class="scene-kicker">${s.emoji} ${sc.kicker}</div>
    <div class="scene-title">${sc.title}</div>
    <div class="base-life">${sc.body}</div>
    <div class="era-card">
      <div class="eh">📅 The world in ${year}</div>
      <div class="era-row"><span class="k">Around you</span><span class="v">${d.world}</span></div>
      <div class="era-row"><span class="k">Money &amp; work</span><span class="v">${d.money}</span></div>
      <div class="era-row"><span class="k">The vibe</span><span class="v">${d.culture}</span></div>
    </div>
    <div class="shift-prompt">If you'd chosen differently —</div>
    <div class="doors">${doors}</div>`;
  stage.querySelectorAll('.door').forEach(b=> b.onclick=()=>renderLifeOutcome(s, parseInt(b.dataset.i,10)));
}

// AI is available only when the page is served by the backend (not opened as a file).
const AI_ENABLED = (location.protocol==='http:'||location.protocol==='https:');

async function renderLifeOutcome(s, i){
  const year=profile.birthYear+s.age, era=eraContext(year), d=eraDetail(year);
  const sc=s.make(profile, year, era);
  const c=sc.choices[i];
  const fallback={outcome:c.outcome, ripple:c.ripple, line:c.line, tone:c.tone, source:'written-in'};
  if(!AI_ENABLED){ return renderLifeOutcomeView(s,i,year,c,fallback); }
  // loading state while the AI writes a universe that has never existed
  const tone=TONE[c.tone]||TONE.love; toneGlow(tone.c);
  chapterEl.textContent="Computing your universe…";
  stage.className="stage fade";
  stage.innerHTML=`<div style="text-align:center;width:100%">
      <div class="collapse-txt">Opening a universe that has<br>never existed before…</div>
      <div class="collapse-sub">writing ${year} just for you</div>
    </div>`;
  let out=null;
  try{ out=await fetchAIOutcome(s,i,year,d,c); }catch(e){ out=null; }
  renderLifeOutcomeView(s,i,year,c, out||fallback);
}

async function fetchAIOutcome(s,i,year,d,c){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),28000);
  try{
    const res=await fetch('/api/generate',{
      method:'POST', headers:{'Content-Type':'application/json'}, signal:ctrl.signal,
      body:JSON.stringify({ profile, stage:s.label, year, era:d, choice:{head:c.head, sub:c.sub}, suggestedTone:c.tone })
    });
    clearTimeout(t);
    if(!res.ok) return null;
    const j=await res.json();
    if(j && j.outcome && j.ripple && j.line){
      return { outcome:j.outcome, ripple:j.ripple, line:j.line, tone:j.tone||c.tone, source:'ai' };
    }
    return null; // server fallback (no key) → use the written-in outcome
  }catch(e){ clearTimeout(t); return null; }
}

function renderLifeOutcomeView(s,i,year,c,out){
  const tone=TONE[out.tone]||TONE.love;

  chapterEl.textContent="The universe it opens";

  const badge = out.source==='ai' ? `◈ ${year} · WRITTEN LIVE, JUST FOR YOU` : `◈ ${year} · REWRITTEN · ${tone.tag}`;

/* ================= Starfield ================= */
const canvas=document.getElementById('stars'), ctx=canvas.getContext('2d');
let starsArr=[], W2, H2;
function resize(){
  W2=canvas.width=window.innerWidth; H2=canvas.height=window.innerHeight;
  const count=Math.min(220,Math.floor(W2*H2/9000));
  starsArr=Array.from({length:count},()=>({x:Math.random()*W2,y:Math.random()*H2,z:Math.random()*.8+.2,r:Math.random()*1.4+.3,tw:Math.random()*Math.PI*2}));
}
function tick(){
  ctx.clearRect(0,0,W2,H2);
  for(const s of starsArr){
    s.tw+=0.02*s.z; const a=.35+Math.sin(s.tw)*.35+.3*s.z;
    ctx.globalAlpha=Math.max(0,Math.min(1,a)); ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=s.z>.7?"#c9d4ff":"#8b93c9"; ctx.fill();
    s.y+=s.z*0.06; if(s.y>H2){s.y=0;s.x=Math.random()*W2;}
  }
  ctx.globalAlpha=1; requestAnimationFrame(tick);
}
window.addEventListener('resize',resize); resize(); requestAnimationFrame(tick);

/* ================= Incoming challenge (viral loop) ================= */
function walkPath(digits){
  let id=STORY.start, t={bold:0,bond:0,grit:0,vision:0}, jrny=[], di=0, guard=0;
  while(guard++<200){
    const node=STORY.nodes[id];
    if(!node) break;
    if(node.ending) break;
    if(node.checkpoint){ id=node.next; continue; }
    const ci=digits[di++]; if(ci==null) break;
    const ch=node.choices[ci]; if(!ch) break;
    for(const k in ch.eff) t[k]+=ch.eff[k];
    jrny.push({chosen:ci,count:node.choices.length});
    id=ch.next;
  }
  return {t,jrny};
}
function parseChallenge(){
  try{
    const p=new URLSearchParams(location.search).get('v');
    if(p && /^[0-9]{3,30}$/.test(p)){
      const digits=p.split('').map(Number);
      const {t,jrny}=walkPath(digits);
      if(jrny.length) return makeResult(t,jrny);
    }
  }catch(e){}
  return null;
}
const incomingChallenge = parseChallenge();

  {

    base:"There's a conversation you'd give anything to rewrite — the last one, before someone was gone. You've replayed it a thousand times. In the universe next door, you get to change the last thing you said. Choose gently.",

        ripple:"The you in the other universe — the one who said something forgettable instead — would trade years to stand where you're standing. There's a grief that comes with a clean goodbye and a grief that comes with an unfinished one. They are not the same weight. This one, you can carry.",

        ripple:"But here's what this hard universe teaches the you who lives it: the silence was not the truth of what you felt. They knew. Love isn't only in the final sentence — it's in the thousand ordinary ones before it. You spend years learning to forgive yourself for the ending, and eventually you do. That forgiveness is its own kind of goodbye.",

  {
    title:"The Mirror That Showed You Later",
    base:"You wake to find a mirror that doesn't show now — it shows you, ten years on. Older. Changed. It only lets you truly look once, and what you do with what you see is the one thing you get to change.",
    variables:[
      { icon:"🧭", label:"You heeded the warning.", sub:"Changed course that same week.", tone:"consequence",
        shift:"The glass showed a version of you worn thin by a road you're currently walking — and you believed it. You changed direction that week: the job, the habit, the person. The scene reshapes into someone lighter, steadier, who dodged a wall they never actually hit.",
        ripple:"But here's the strange cost of a warning heeded: you never get to know how bad it would've been. This you sometimes doubts the whole thing, wonders if they gave up a road that might've been fine. Prevention is invisible. You saved yourself from something you'll never get to see — and part of you will always wonder if it was real.",
        line:"The reward for dodging the wall is that you never get to see the wall. Trust the swerve anyway." },

        shift:"The mirror offered one look. You took a hundred. The scene darkens as the future-you in the glass starts to feel more real than the present-you standing before it. You begin living for the reflection, editing every ordinary day to match it, or to escape it.",
        ripple:"That's the trap: a life spent staring at what's coming is a life you aren't actually living. This you missed a decade of warm, unrepeatable now because they couldn't look away from a maybe. The future became a haunted house they moved into years early. Some doors are cursed not by what's behind them, but by how long you stand there staring.",

  {
    title:"The Wallet Full of Cash",
    base:"You find it on the sidewalk — a wallet, thick with cash, nobody around, no camera in sight. A whole month's rent, just sitting there. In the universe beside this one, you make a different call. Let's change it.",
    variables:[
      { icon:"🤲", label:"You tracked down the owner and returned it.", sub:"Every last dollar.", tone:"love",
        shift:"Warm light. It took effort — an ID, a couple of calls, an awkward drive across town. The owner turned out to be someone barely hanging on, and that cash was the whole difference between okay and catastrophe. You handed it back and watched a stranger nearly come apart with relief.",
        ripple:"You never got a reward. You got something money can't buy: the exact knowledge of who you are when no one is watching. In this universe, on your hardest nights, you can reach for that memory like a stone in your pocket — proof, in your own handwriting, that you're good. That's worth more than a month's rent, and it compounds.",

        ripple:"Because it got a little easier to do the next thing. And the next. Nobody becomes a person they don't recognize in one leap — it's always a quiet series of small, victimless, nobody's-watching choices that were technically fine. This you is doing okay. This you also can't quite hold their own eyes in the mirror over a thing they'd swear they forgot. They didn't.",

        ripple:"Some universes hand you a gift that's really a hook. You spend this timeline glancing over your shoulder, learning the hard way that free money is the most expensive kind. You get out of it — mostly — but you never again mistake luck for luck without first asking who it belongs to.",

  {
    title:"The Door in the Basement",
    base:"You got the place cheap — too cheap, in hindsight. On the third night you hear it: something behind the little door in the basement you were told to leave shut. In the universe next door, you don't leave it shut. Let's change that.",
    variables:[
      { icon:"🔦", label:"You opened it and looked.", sub:"You had to know.", tone:"scary",
        shift:"The temperature drops ten degrees in a single breath. The door swings into a dark that feels older than the house, and the sound stops — because it heard you, and now it's listening back. The scene holds absolutely still. Something in there has been waiting a very long time for someone curious enough.",
        ripple:"You shut it. Fast. You're moved out by the weekend. And for the rest of your life you understand a thing most people are lucky never to learn: some doors are shut FOR you, not against you — and the only winning move is to respect the ones you were warned about. You never find out what it was. That part is the mercy.",

        shift:"The scene curdles slowly. You told yourself it was pipes, raccoons, the house settling. You were tired of running from things. So you stayed, and you learned to live alongside the sound — and the sound learned to live alongside you.",
        ripple:"This is the quiet horror nobody warns you about: you can get used to almost anything if you decide it's normal. This you sleeps fine now. This you also stopped inviting anyone over a while back, and couldn't quite tell you when. Some things don't have to hurt you to change you. They just have to move in and wait.",

  {
    title:"The Other You",
    base:"There's a version of you in the universe next door who made every choice you didn't. Tonight, for one impossible moment, the wall between you thins — and you can reach across. Let's change what you do with that.",
    variables:[
      { icon:"🫂", label:"You met them, and talked all night.", sub:"The you who zigged where you zagged.", tone:"love",
        shift:"Warmth pools in the space between two versions of one soul. You sat with the you who went the other way, and instead of envy there was recognition — two people from the same start who both, in their own way, kept going. You compared scars. You laughed at the same jokes. You forgave each other for choices neither of you made.",
        ripple:"You went back to your own life lighter. Not because theirs was worse — it wasn't, just different — but because you finally understood there was never a 'right' you that got away. There's only this one, doing their best down one of infinite roads. Meeting yourself turns out to be the fastest cure for wishing you were someone else.",

        ripple:"You handed each other's lives back by dinner, both deeply relieved, both a little more grateful for the specific mess you already know how to navigate. The grass is always greener until you have to find where the other person keeps their spoons. Your life, spoons and all, looked a whole lot better on the walk home.",

  {
    title:"The Unlocked Phone",
    base:"Their phone is right there, unlocked, and they've stepped out of the room. Whatever you've been wondering, whatever you've been afraid to ask — the answer is thirty seconds and one scroll away. In the universe next door, you make a different choice. Let's change it.",

        ripple:"You put it down. You do not pick it up again. Some universes let you snoop right up until you find the one door that was watching for you the whole time. This you learns the oldest lesson there is: be careful what you go hunting for in the dark. Every so often, it has been hunting you first.",

  {
    title:"The Ordinary Day, On Repeat",
    base:"You're handed one gift: a single ordinary day, given back to live again. Not a special one — a Tuesday. Groceries, traffic, a small argument, a sunset you never looked at. In the universe next door, you replay it differently. Let's change it.",

        ripple:"And it wrecked you, gently, to realize how many of these you'd sleepwalked straight through. This you goes back to their real life and starts treating ordinary days like the rare things they secretly are. You didn't need to change the day. You needed to change how present you were inside it. Nobody tells you that's the whole trick.",
        line:"You don't get infinite Tuesdays. You get a specific number — and you're spending one of them right now. Look up in a second." },

        ripple:"And it was hollow. A day managed to perfection is still a day you spent managing instead of living. This you learns that chasing the flawless day is its own quiet prison — that the argument you 'won' cost you the closeness a clumsy, honest one would have built. Perfect and alive are different targets. You cannot aim at both.",
        line:"A perfectly optimized life and a fully lived one are not the same life. Decide which Tuesday you actually want." },

        ripple:"It was not a rerun. Turns out every Tuesday counts, even the ones you're sure are practice. You spend the following week apologizing, rehired out of pity, weirdly exhilarated and mildly damp. Worth it? Unclear. But you did learn there's a version of you in there who'd dance in a fountain — and it's genuinely nice to know they exist.",

  {
    title:"The Dream You Handed Back",
    base:"There was a dream once — the big, impractical, whole-heart one. And there was a moment you quietly handed it back in exchange for something safer, realer, more responsible. In the universe next door, you made the other trade. Let's change it.",

        shift:"The scene splits the difference and glows in two colors at once. You didn't fully chase it and didn't fully bury it. You kept a corner — the dream at nights, on weekends, in stolen hours — refusing to let it die even as you carried the responsible life on the other shoulder.",

const PACKS = [
  { id:'mix',    name:'The Original Mix', emoji:'🌌', blurb:'A little of everything — love, dread, comedy, consequence.', vignettes:SHIFTS },
  { id:'horror', name:'Nightmare Fuel',   emoji:'🩸', blurb:'All horror. Do not open the basement door.',            vignettes:HORROR_PACK },
  { id:'comedy', name:'Absurd Timelines', emoji:'😂', blurb:'All comedy. The multiverse is deeply unserious.',       vignettes:COMEDY_PACK },
  { id:'love',   name:'The Heart Ones',   emoji:'❤️', blurb:'All love. Every choice is really about who you keep.',   vignettes:LOVE_PACK },
  { id:'ceo',    name:'The Founder',      emoji:'💼', blurb:'All business. One decision reshapes the whole empire.',  vignettes:CEO_PACK },
  { id:'family', name:'The Bloodline',    emoji:'🏡', blurb:'All family. The universe starts at the kitchen table.',  vignettes:FAMILY_PACK },
];

let activePack = PACKS[0];
let shiftIdx = 0;

function toneGlow(color){
  const el=document.getElementById('toneglow');
  if(!el) return;
  if(!color){ el.style.opacity=0; return; }
  el.style.background=`radial-gradient(75% 60% at 50% 42%, ${color}55, transparent 72%)`;
  el.style.opacity=1;
}

function startShiftMode(){ renderPackPicker(); }

function renderPackPicker(){
  toneGlow(null);
  chapterEl.textContent="Change One Thing";
  pathLabel.textContent=""; pathSvg.innerHTML="";
  stage.className="stage fade";
  const cards=PACKS.map((p,i)=>`
    <button class="door" data-i="${i}">
      <span class="icon">${p.emoji}</span>
      <span class="txt"><b>${p.name} · ${p.vignettes.length}</b><span>${p.blurb}</span></span>
    </button>`).join('');
  stage.innerHTML=`
    <div class="scene-kicker">Pick a universe pack</div>
    <div class="scene-title">Which reality do you want to bend?</div>
    <div class="base-life">Each pack is a different flavor of "what if." Some will make you laugh. Some will keep you up tonight. Choose your door.</div>
    <div class="doors">${cards}</div>
    <div class="btn-row"><button class="btn ghost" id="backTitle">← Back</button></div>`;
  stage.querySelectorAll('.door').forEach(b=> b.onclick=()=>{
    activePack = PACKS[parseInt(b.dataset.i,10)];
    shiftIdx = Math.floor(Math.random()*activePack.vignettes.length);
    renderShift(shiftIdx);
  });
  document.getElementById('backTitle').onclick=renderTitle;
}

function renderShift(idx){
  toneGlow(null);
  const V=activePack.vignettes[idx];
  chapterEl.textContent=activePack.name;
  pathLabel.textContent=""; pathSvg.innerHTML="";
  stage.className="stage fade";
  const doors=V.variables.map((v,i)=>`
    <button class="door" data-i="${i}">
      <span class="icon">${v.icon}</span>
      <span class="txt"><b>${v.label}</b><span>${v.sub}</span></span>
    </button>`).join('');
  stage.innerHTML=`
    <div class="scene-kicker">${activePack.emoji} ${activePack.name} · a universe next door</div>
    <div class="scene-title">${V.title}</div>
    <div class="base-life">${V.base}</div>
    <div class="shift-prompt">Change one thing —</div>
    <div class="doors">${doors}</div>`;
  stage.querySelectorAll('.door').forEach(b=> b.onclick=()=>renderShifted(idx, parseInt(b.dataset.i,10)));
}

function renderShifted(idx, vi){
  const v=activePack.vignettes[idx].variables[vi], tone=TONE[v.tone];
  toneGlow(tone.c);
  chapterEl.textContent="Reality shifting…";
  stage.className="stage reality";
  stage.innerHTML=`
    <span class="tone-tag" style="color:${tone.c};border-color:${tone.c}66;background:${tone.c}18">◈ REALITY SHIFTED · ${tone.tag}</span>
    <div class="scene-kicker">You changed: ${v.label}</div>
    <div class="shift-new">${v.shift}</div>
    <div class="btn-row"><button class="btn" id="costBtn">See what it costs →</button></div>`;
  document.getElementById('costBtn').onclick=()=>renderRipple(idx,vi);
}

function renderRipple(idx, vi){
  const v=activePack.vignettes[idx].variables[vi], tone=TONE[v.tone];
  toneGlow(tone.c);
  chapterEl.textContent="The ripple";
  stage.className="stage fade";
  stage.innerHTML=`
    <span class="tone-tag" style="color:${tone.c};border-color:${tone.c}66;background:${tone.c}18">◈ ${tone.tag}</span>
    <div class="shift-new dim">${v.shift}</div>
    <div class="ripple-label">…and then the ripple</div>
    <div class="ripple-txt">${v.ripple}</div>
    <div class="shift-line">${v.line}</div>
    <div class="btn-row">
      <button class="btn" id="elseBtn">Change something else</button>
      <button class="btn ghost" id="nextUniBtn">Slide to another universe →</button>
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn ghost" id="packBtn">← Another pack</button>
      <button class="btn ghost" id="menuBtn">Back to the start</button>
    </div>`;
  document.getElementById('elseBtn').onclick=()=>renderShift(idx);
  document.getElementById('nextUniBtn').onclick=()=>{
    const n=activePack.vignettes.length;
    shiftIdx = n>1 ? (idx + 1 + Math.floor(Math.random()*(n-1))) % n : 0;
    renderShift(shiftIdx);
  };
  document.getElementById('packBtn').onclick=()=>{ toneGlow(null); renderPackPicker(); };
  document.getElementById('menuBtn').onclick=()=>{ toneGlow(null); renderTitle(); };
}

// go
renderTitle();
</script>
